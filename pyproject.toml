[project]
name = "bestiario-ded-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "requests>=2.32,<3.0",
    "tabulate>=0.9,<1.0",
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.15.22,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `tests/api/test_rotas.py` e `tests/web/test_rotas.py` têm o mesmo nome-base
# em pacotes sem `__init__.py`; o modo padrão de import do pytest colide os
# dois. `importlib` os identifica pelo caminho completo, sem exigir pacote.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I ordenação de imports (stdlib → terceiros → local)
select = ["E", "W", "F", "I"]
